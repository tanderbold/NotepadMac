name: Bug report
description: Something in NotepadMac does not work, or works differently from Notepad++ on Windows.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing NotepadMac. This is the Mac port's own tracker - please do not report Mac problems to the Notepad++ project.
        Do not attach files with private or confidential content: a small made-up file that shows the problem is best.
  - type: input
    id: version
    attributes:
      label: NotepadMac version
      description: Help > About NotepadMac, or Help > Debug Info (which also gives the build).
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 14.6, Apple silicon (M2)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a fresh start if you can. Menu names as they appear in English help us most.
      placeholder: |
        1. Open a file with Windows (CRLF) line endings
        2. Search > Replace, regular expression `\s+$`, Replace All
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If you know what Notepad++ on Windows does in the same case, say so - it is the reference the port follows.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Screenshots help for anything visual.
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: Crash report (if it crashed)
      description: |
        macOS keeps it in ~/Library/Logs/DiagnosticReports (NotepadMac-*.ips). Paste the first 60 lines or attach the file.
      render: text
  - type: dropdown
    id: settings
    attributes:
      label: Settings brought over from Windows?
      options:
        - "No"
        - "Yes - session.xml, shortcuts.xml, UDLs, themes or others"
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Interface language, theme, plugins you built, a sample file (made up, please).
